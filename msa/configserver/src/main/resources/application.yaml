server:
  port: 8888
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      server:
        git:
          uri: https://github.com/kini5766/ibm05_spring_cloud_config.git
          clone-on-start: true
          default-label: main
      bus:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: busrefresh, health