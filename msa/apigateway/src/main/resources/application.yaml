server:
  port: 8081

# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/  => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - 'http://localhost:3000'
                  - 'http://localhost:5173'
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: '*'
                allowCredentials: true
          routes:
            - id: member-service
              predicates:
                - Path=/member-service/member/**, /member-service/admin/**
              filters:
                - StripPrefix=1
              uri: lb://member-service

            - id: member-oauth
              predicates:
                - Path=/login/oauth2/**
              uri: lb://member-service

            - id: ordering-service
              predicates:
                - Path=/ordering-service/ordering/**, /ordering-service/admin/**
              filters:
                - StripPrefix=1
              uri: lb://ordering-service

            - id: product-service
              predicates:
                - Path=/product-service/product/**, /product-service/admin/**
              filters:
                - StripPrefix=1
              uri: lb://product-service

            - id: board-service
              predicates:
                - Path=/board-service/board/**, /board-service/admin/**
              filters:
                - StripPrefix=1
              uri: lb://board-service
auth:
  access-token-key-id: es256-2026
  access-token-public: ${JWT_SECRET:-----BEGIN PUBLIC KEY-----MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7wOxzOM9xtHw9RvbS19kvJeoioQxiI9vA5BfCEUAkO4bzjy+ODGws6oL7Vv6Dv0YXGdwLqmIkrn6RKujHYoH7g==-----END PUBLIC KEY-----}
  exclude-paths:
    - /member/login
    - /member/refresh
    - /member/create
    - /member/exists/*
    - /member/cookie/exchange
    - /login/oauth2/**
    - /product/list
    - /product/search/*
    - /product/detail/*